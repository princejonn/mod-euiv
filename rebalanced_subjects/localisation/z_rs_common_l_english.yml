l_english:

  # new diplomatic actions

  FROM_MUST_HAVE_100_OPINION_TT: "§R- §Y[From.GetName]§! does not have above §Y100§! opinion of §Y[Root.GetName]§!.§!"
  FROM_MUST_HAVE_190_OPINION_TT: "§R- §Y[From.GetName]§! does not have above §Y190§! opinion of §Y[Root.GetName]§!.§!"

  form_personal_union_from_vassal_title: "Form Personal Union"
  form_personal_union_from_vassal_tooltip: "Convert [From.GetName] into a Personal Union."
  form_personal_union_from_vassal_desc: "Convert [From.GetName] into a Personal Union. In a personal union two countries are ruled by the same monarch. The lesser partner must follow his overlord to war and cannot make certain diplomatic actions. When the monarch dies the union might either continue, break or the lesser partner can get inherited and annexed."
  form_personal_union_from_vassal_alert_tooltip: "An offer to turn us into a Personal Union"
  form_personal_union_from_vassal_dialog: "[This.GetName] wants to turn us into their Personal Union."

  promote_personal_union_to_dynastic_title: "Form Dynastic Union"
  promote_personal_union_to_dynastic_tooltip: "Convert [From.GetName] into a §YDynastic Union§!. A Dynastic Union is a Personal Union that is guaranteed to never be inherited or annexed by the senior partner."
  promote_personal_union_to_dynastic_desc: "Convert [From.GetName] into a §YDynastic Union§!. A Dynastic Union is a Personal Union that is guaranteed to never be inherited or annexed by the senior partner.\n\nThey will instead give their overlord military and economic bonuses."

  demote_dynastic_union_to_personal_title: "Form Personal Union"
  demote_dynastic_union_to_personal_tooltip: "Convert [From.GetName] into a §YPersonal Union§!. A Personal Union can eventually be inherited or annexed by the senior partner."
  demote_dynastic_union_to_personal_desc: "Convert [From.GetName] into a §YPersonal Union§!. In a personal union two countries are ruled by the same monarch. The lesser partner must follow his overlord to war and cannot make certain diplomatic actions. When the monarch dies the union might either continue, break or the lesser partner can get inherited and annexed.\n\nThis will greatly upset [From.GetName]."

  # opinion modifiers

  is_dynastic_union: "Dynastic Union"
  promoted_dynastic_union: "They promoted us to Dynastic Union"
  demoted_dynastic_union: "They demoted us from Dynastic Union"

  # subject types

  dynastic_union: "Dynastic Union"
  dynastic_union_title: "Dynastic Union"
  dynastic_union_title_plural: "Dynastic Unions"
  dynastic_union_is_our: "§Y$NAME$§! is our Dynastic Union."
  dynastic_union_long_desc: "In a personal union two countries are ruled by the same monarch. The lesser partner must follow his overlord to war and cannot make certain diplomatic actions. When the monarch dies the union will not break, but the lesser partner will never be inhereted, and cannot be annexed."
