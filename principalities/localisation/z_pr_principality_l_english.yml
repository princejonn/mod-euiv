  fabricate_principality_cb: "Justify Campaign"
  fabricate_principality_cb_title: "Justify Campaign"
  fabricate_principality_cb_desc: "Justify Campaign will reduce the size of our §Y[From.GetAdjective]§! Spy Network by §R[Root.GetSpyCostHardCoded]§! and will give us the '§YCampaign of Imperial Expansion§!' casus belli against §Y[From.GetName]§!, allowing us to subjugate §Y[From.GetName]§! and turning them into a §YPrincipality§! of our [Root.GovernmentName].\n\nThis casus belli will last for §Y10 years§!.\n\n§YPrincipalities can be turned into Core Principalities which can be annexed for 4 £dip£ per development.§!"
  fabricate_principality_cb_tooltip: "Justify an campaign against the target country and gain the 'Campaign of Imperial Expansion' casus belli against them."
  HAS_PRINCIPALITY_CB_ALREADY_TT: "§R- §Y[Root.GetName]§! already has an §YCampaign of Imperial Expansion§! casus belli against §Y[From.GetName]§!.§!"

  promote_vassal_to_principality_title: "Form Principality"
  promote_vassal_to_principality_tooltip: "Convert [From.GetName] into a Principality. A Principality is an autonomous vassal state, aligned politically and ideologically with its protector, while maintaining local governance in support of the empire."
  promote_vassal_to_principality_desc: "Convert [From.GetName] into a Principality. A Principality is a foreign state modeled after the ideals of the overlord's governance, granted autonomy while remaining loyal to its protector, promoting shared values and strategic interests abroad. Principalities cannot be Annexed but they provide their overlord powerful bonuses."
  promote_vassal_to_principality_alert_tooltip: "An offer to turn us into a §YPrincipality§!"
  promote_vassal_to_principality_dialog: "[This.GetName] wants to turn us into their §YPrincipality§!."

  promote_union_to_principality_title: "Form Principality"
  promote_union_to_principality_tooltip: "Convert [From.GetName] into a Principality. A Principality is an autonomous vassal state, aligned politically and ideologically with its protector, while maintaining local governance in support of the empire."
  promote_union_to_principality_desc: "Convert [From.GetName] into a Principality. A Principality is a foreign state modeled after the ideals of the overlord's governance, granted autonomy while remaining loyal to its protector, promoting shared values and strategic interests abroad. Principalities cannot be Annexed but they provide their overlord powerful bonuses."
  promote_union_to_principality_alert_tooltip: "An offer to turn us into a §YPrincipality§!"
  promote_union_to_principality_dialog: "[This.GetName] wants to turn us into their §YPrincipality§!."

  demote_principality_to_vassal_title: "Revoke Principality Status"
  demote_principality_to_vassal_tooltip: "Convert [From.GetName] into a Vassal."
  demote_principality_to_vassal_desc: "Convert [From.GetName] into a Vassal. A Vassal is a subject state that is directly controlled by its overlord, with no autonomy or local governance. Vassals can be integrated into the overlord's realm, but they do not provide the same bonuses as a Principality."
  demote_principality_to_vassal_alert_tooltip: "An offer to turn us into a §YVassal§!"
  demote_principality_to_vassal_dialog: "[This.GetName] wants to turn us into their §YVassal§!."

  rein_in_principality_title: "Rein in Principality"
  rein_in_principality_desc: "Rein in §Y[From.GetName]§!'s and turn them into a §YCore Principality§!. This will allow us to integrate §Y[From.GetName]§!, but we will not be able to call §Y[From.GetName]§! into any wars.\n\n§YCore Principalities can be annexed for 4 £dip£ per development.§!"
  rein_in_principality_tooltip: "Rein in the target from Principality to Core Principality status, allowing us to integrate the target, but disabling our ability to call them in our wars."
  rein_in_principality_alert_tooltip: "An offer to turn us into a §YCore Principality§!"
  rein_in_principality_dialog: "[This.GetName] wants to turn us into their Core Principality, exempting us from their wars, but allowing them to integrate us."

  call_principality_into_wars_title: "Call into Wars"
  call_principality_into_wars_tooltip: "Call [From.GetName] into our current wars."
  call_principality_into_wars_desc: "Call [From.GetName] into our current wars."

  join_principality_wars_title: "Join Wars"
  join_principality_wars_tooltip: "Join [From.GetName]'s Current Wars."
  join_principality_wars_desc: "Join [From.GetName]'s Current Wars."

  grant_autonomy_to_core_principality_title: "Grant Autonomy"
  grant_autonomy_to_core_principality_tooltip: "Grant autonomy to our Core Principality and turn it into a normal Principality."
  grant_autonomy_to_core_principality_desc: "Do you wish to grant autonomy to §Y[From.GetName]§! and turn them into a §YPrincipality§!?\n§YPrincipalities§! can be called into wars, but cannot be integrated."

