  principality_title_plural: "Principalities"
  principality_is_our: "§Y$NAME$§! is our Principality."
  principality_long_desc: "Principalities are special Imperial subjects which focuses purely on governing the land and allowing democratic rule for its people. Unlike other subject types, a Principality will not join any wars on its own unless directly ordered by its overlord."

  core_principality: "Core Principality"
  core_principality_title: "Core Principality"
  core_principality_title_plural: "Core Principalities"
  core_principality_is_our: "§Y$NAME$§! is our Core Principality."
  core_principality_long_desc: "A Core Principality behaves like any other Principality, but is much closer tied to its overlord and is barely any different from directly controlled territory. Unlike normal Principalities, a Core Principality cannot be called into any wars and can be annexed."

