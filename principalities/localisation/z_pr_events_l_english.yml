l_english:
  join_principality_war.2.title: "Principality calls for Aid"
  join_principality_war.2.desc: "Our Principality [principality_aid_target.GetName] is in dire need of help in their war. They have called for aid!"
  join_principality_war.2.a: "And [Root.GetName] will answer!"
  join_principality_war.2.b: "A few ducats should suffice"
  join_principality_war.2.c: "We shall send our men to help"
  join_principality_war.2.d: "What have they done for us?"

  union_petitioning_emperor.2.title: "Union Petitioning for Sisterhood"
  union_petitioning_emperor.2.desc: "The people of [personal_union_petitioning_target.GetName] have petitioned to become our Principality. A Principality is an autonomous vassal state, aligned politically and ideologically with its protector, while maintaining local governance in support of shared revolutionary or republican principles.\n\nShould we accept this change in status?"
  union_petitioning_emperor.2.a: "Yes, they shall be our Principality"
  union_petitioning_emperor.2.b: "No, they shall remain a Personal Union"
